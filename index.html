
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1877f2">
  <title>Facebook Access Control</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #f0f2f5;
      color: #1c1e21;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #1877f2;
      color: white;
      text-align: center;
      padding: 17px;
      font-size: 29px;
      font-weight: bold;
    }

    main {
      max-width: 440px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 2px 10px #00000012;
    }

    .logo {
      background: #1877f2;
      color: white;
      width: 65px;
      height: 65px;
      line-height: 70px;
      border-radius: 50%;
      margin: 0 auto 18px;
      font-size: 48px;
      font-weight: bold;
    }

    h1 { font-size: 23px; margin: 8px 0 12px; }

    p {
      font-size: 15px;
      line-height: 1.55;
      color: #606770;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 15px 12px;
      margin-top: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary { background: #1877f2; color: white; }
    .secondary { background: #e4e6eb; color: #1c1e21; }

    .status {
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      background: #f0f2f5;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success { background: #e8f7ed; color: #18723b; }
    .error { background: #fff0ef; color: #b42318; }

    .contacts { margin-top: 20px; font-size: 14px; }
    .contacts a {
      display: inline-block;
      margin: 8px 4px;
      color: #1877f2;
      text-decoration: none;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 20px;
      font-size: 12px;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <header>facebook</header>

  <main>
    <section class="card">
      <div class="logo">f</div>

      <h1 id="heading">Checking your access...</h1>
      <p id="description">Please wait while we verify your account.</p>

      <div id="status" class="status" role="status" aria-live="polite">
        Connecting securely...
      </div>

      <div id="approvedActions" hidden>
        <button id="insideButton" class="primary">
          Open Facebook Inside Mini App
        </button>

        <button id="appButton" class="secondary">
          Open Facebook App
        </button>
      </div>

      <button id="retryButton" class="primary" hidden>
        Try Again
      </button>

      <button id="requestButton" class="secondary" hidden>
        Request Access
      </button>

      <div id="contacts" class="contacts" hidden>
        Need help?
        <br>
        <a href="https://t.me/Yangyang_pvt"
           target="_blank" rel="noopener noreferrer">
          Telegram Support
        </a>
        <br>
        <a href="https://wa.me/15795651739"
           target="_blank" rel="noopener noreferrer">
          WhatsApp Support
        </a>
      </div>
    </section>
  </main>

  <footer>Facebook Access Control</footer>

  <script>
    "use strict";

    const API_URL =
      "https://facebook-access-control-new.rich0810755.workers.dev";

    const FACEBOOK_URL = "https://www.facebook.com/";

    const tg = window.Telegram?.WebApp;

    const heading = document.getElementById("heading");
    const description = document.getElementById("description");
    const statusBox = document.getElementById("status");
    const approvedActions = document.getElementById("approvedActions");
    const insideButton = document.getElementById("insideButton");
    const appButton = document.getElementById("appButton");
    const retryButton = document.getElementById("retryButton");
    const requestButton = document.getElementById("requestButton");
    const contacts = document.getElementById("contacts");

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status" + (type ? " " + type : "");
      statusBox.hidden = false;
    }

    function hideActions() {
      approvedActions.hidden = true;
      retryButton.hidden = true;
      requestButton.hidden = true;
      contacts.hidden = true;
    }

    async function verifyAccess() {
      hideActions();

      heading.textContent = "Checking your access...";
      description.textContent = "Please wait while we verify your account.";
      setStatus("Connecting securely...");

      try {
        if (!tg || !tg.initData) {
          throw new Error(
            "Open this page using the Open App button in your Telegram bot."
          );
        }

        const response = await fetch(API_URL + "/api/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData })
        });

        const result = await response.json();

        if (response.status === 403) {
          heading.textContent = "Access denied";
          description.textContent =
            "Your Telegram account has not been approved.";
          setStatus(
            result.message || "Please request access through the bot.",
            "error"
          );
          requestButton.hidden = false;
          contacts.hidden = false;
          return;
        }

        if (!response.ok || !result.ok || !result.access) {
          throw new Error(
            result.error || result.message || "Access verification failed."
          );
        }

        heading.textContent = "Welcome, access granted!";
        description.textContent =
          "Choose how you want to open Facebook.";

        setStatus("Your account is approved.", "success");
        approvedActions.hidden = false;

      } catch (error) {
        heading.textContent = "Unable to verify access";
        description.textContent =
          "Check your connection and try again.";

        setStatus(error.message || "A connection error occurred.", "error");
        retryButton.hidden = false;
        contacts.hidden = false;
      }
    }

    // Option 1: Navigate within the current Mini App webview.
    insideButton.addEventListener("click", () => {
      window.location.assign(FACEBOOK_URL);
    });

    // Option 2: Ask Telegram to open the Facebook website externally.
    // The phone may route the link to the installed Facebook app.
    appButton.addEventListener("click", () => {
      if (tg && typeof tg.openLink === "function") {
        tg.openLink(FACEBOOK_URL);
      } else {
        window.open(FACEBOOK_URL, "_blank", "noopener,noreferrer");
      }
    });

    retryButton.addEventListener("click", verifyAccess);

    requestButton.addEventListener("click", () => {
      if (tg && typeof tg.close === "function") {
        tg.close();
      }
      setStatus("Return to the bot chat and send /request.");
    });

    verifyAccess();
  </script>
</body>
</html>
